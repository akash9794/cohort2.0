        async function fetchAnimalData() {
            const res = await fetch("https://fakerapi.it/api/v1/persons");
            const finalData = await res.json();
            document.getElementById("dataRenderer").innerHTML = JSON.stringify(finalData.data);
        }
    </script>
    <div id="dataRenderer"></div>
    <button onclick="fetchAnimalData()">Get Animal Data</button>
